name: Build & Publish Azure DevOps Extension

# Runs on every push to main (build + package only, as a sanity check /
# downloadable artifact) and publishes to the Marketplace only when you
# push a version tag like "v1.0.1".
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Marketplace (requires AZDO_MARKETPLACE_PAT secret)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (webpack)
        run: npm run build

      - name: Package .vsix
        run: npx tfx-cli extension create --manifest-globs vss-extension.json --output-path ./package

      - name: Upload .vsix as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: azdo-intelligence-hub-vsix
          path: package/*.vsix
          retention-days: 30

      # Publishes only when triggered by a version tag (v*.*.*) or a manual
      # workflow_dispatch run with "publish" checked. Requires a repo secret
      # AZDO_MARKETPLACE_PAT: a Marketplace PAT with "Marketplace (Publish)"
      # scope, generated from https://marketplace.visualstudio.com/manage
      - name: Publish to Marketplace
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          AZDO_MARKETPLACE_PAT: ${{ secrets.AZDO_MARKETPLACE_PAT }}
        run: |
          if [ -z "$AZDO_MARKETPLACE_PAT" ]; then
            echo "::error::AZDO_MARKETPLACE_PAT secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx tfx-cli extension publish \
            --manifest-globs vss-extension.json \
            --token "$AZDO_MARKETPLACE_PAT"
